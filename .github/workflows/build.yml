# CI build: on every push/PR, cross-compile all release binaries via the
# Dockerfile (which also runs lint + typecheck + tests as build gates) and
# smoke-test the linux-x64 binary. On a push to master (or a manual run) it also
# runs the rendered-screen e2e tapes against the freshly built binary. Publishing
# releases lives in release.yml.
name: build

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # Persist BuildKit's layer cache across runs. The key is stable across
      # source-only commits (it hashes only the dependency-defining files), so
      # the base image, bun install, and the cross-compile runtime warm-up are
      # restored; restore-keys still gives a partial hit when deps change.
      - name: Restore BuildKit layer cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /tmp/.buildx-cache
          key: buildx-${{ hashFiles('bun.lock', 'package.json', 'tsconfig.json', 'biome.jsonc', '.bun-version', 'Dockerfile') }}
          restore-keys: |
            buildx-

      - name: Cross-compile all platform binaries
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: export
          outputs: type=local,dest=./out
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      # Replace the old cache with the freshly exported one so actions/cache
      # saves the latest layers and the cache does not grow unbounded.
      - name: Rotate BuildKit layer cache
        if: always()
        run: |
          rm -rf /tmp/.buildx-cache
          [ -d /tmp/.buildx-cache-new ] && mv /tmp/.buildx-cache-new /tmp/.buildx-cache || true

      - name: Smoke test linux-x64 binary
        run: |
          ./out/linux-x64/ccc-morph --version
          ./out/linux-x64/ccc-morph --help | head -20

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: binaries
          path: out/

      # Rendered-screen e2e (ttyd + vhs), reusing the exported linux-x64 binary.
      # Push to master (or a manual run) only — PRs and pushes to other branches
      # skip it. See test/e2e/README.md.
      - name: Run e2e tapes
        if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event_name == 'workflow_dispatch' }}
        run: |
          cp out/linux-x64/ccc-morph test/e2e/ccc-morph
          docker build -f test/e2e/Dockerfile -t ccc-morph-e2e test/e2e
          mkdir -p e2e-out
          # No -v bind mount: this runner is itself a container, so a -v source
          # path resolves on the host daemon, not here (the artifacts would land
          # out of reach and upload finds nothing). Run, then docker cp the
          # artifacts out regardless of pass/fail, preserving the exit code.
          rc=0
          docker run --name ccc-morph-e2e-run ccc-morph-e2e || rc=$?
          docker cp ccc-morph-e2e-run:/e2e/out/. e2e-out/ || true
          docker rm ccc-morph-e2e-run >/dev/null 2>&1 || true
          exit "$rc"

      - name: Upload e2e artifacts
        if: ${{ always() && ((github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event_name == 'workflow_dispatch') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-artifacts
          path: e2e-out/
