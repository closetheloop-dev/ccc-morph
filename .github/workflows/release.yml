# Release: push a tag v<x.y.z> (matching package.json "version") to build all
# platform binaries, package them (scripts/package-binaries.sh), and create a
# DRAFT GitHub release with the tar.gz archives + SHA256SUMS.txt attached.
#
# Flow: bump "version" in package.json -> commit -> git tag v<x.y.z> ->
# git push origin v<x.y.z>. The first step hard-fails on tag/version
# mismatch. When the draft appears under Releases, write the notes and click
# "Publish release" (publishing does not re-trigger this workflow — the tag
# already exists).
#
# The repo uses immutable releases: assets can only be attached while the
# release is still a draft, and a published release's tag can never be
# reused. So do NOT publish via the "Create new release" button — that
# publishes an empty, permanently asset-less release and burns the version.
#
# The release step (softprops/action-gh-release) authenticates with the
# built-in GITHUB_TOKEN, which needs the "contents: write" permission below.
name: release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Verify tag matches package.json version
        run: |
          pkg="$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' package.json | head -1)"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$pkg" != "$tag" ]; then
            echo "tag (v$tag) does not match package.json version ($pkg)" >&2
            exit 1
          fi

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # See build.yml for how the layer cache is keyed and rotated.
      - name: Restore BuildKit layer cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /tmp/.buildx-cache
          key: buildx-${{ hashFiles('bun.lock', 'package.json', 'tsconfig.json', 'biome.jsonc', '.bun-version', 'Dockerfile') }}
          restore-keys: |
            buildx-

      - name: Cross-compile all platform binaries
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: export
          build-args: |
            VERSION=${{ github.ref_name }}
          outputs: type=local,dest=./out
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      - name: Rotate BuildKit layer cache
        if: always()
        run: |
          rm -rf /tmp/.buildx-cache
          [ -d /tmp/.buildx-cache-new ] && mv /tmp/.buildx-cache-new /tmp/.buildx-cache || true

      - name: Smoke test linux-x64 binary
        run: |
          ./out/linux-x64/ccc-morph --version | grep -F "${{ github.ref_name }}"

      - name: Package release assets
        run: bash scripts/package-binaries.sh "$GITHUB_REF_NAME"

      - name: Create draft release and attach assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: true
          files: assets/*
